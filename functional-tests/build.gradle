
plugins {
    id 'io.micronaut.internal.build.functional-testing'
}

description = """
This project contains functional tests for combinations of plugins
"""

repositories {
    mavenCentral()
}

functionalTesting {
    pluginUnderTest('platform-catalog')
    pluginUnderTest('minimal')
    pluginUnderTest('graalvm')
    pluginUnderTest('docker')
    pluginUnderTest('aot')
    pluginUnderTest('gradle')
    pluginUnderTest('openapi')
    pluginUnderTest('test-resources')
    pluginUnderTest('openrewrite')
    pluginUnderTest('configuration-validation')
}

dependencies {
    testImplementation gradleTestKit()
    testImplementation testFixtures(projects.micronautMinimalPlugin)
}

tasks.withType(Test).configureEach {
    // a repository with the core that has development mode, for the tests that launch it: they are skipped without
    def devRepository = providers.gradleProperty("micronautDevRepository")
    if (devRepository.present) {
        systemProperty "micronautDevRepository", file(devRepository.get()).absolutePath
    }
}
